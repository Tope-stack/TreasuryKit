name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start PostgreSQL via Testcontainers using the runner's Docker.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-and-test, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: treasurykit
          POSTGRES_USER: treasurykit
          POSTGRES_PASSWORD: treasurykit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U treasurykit -d treasurykit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__TreasuryKit: Host=localhost;Port=5433;Database=treasurykit;Username=treasurykit;Password=treasurykit
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build .NET hosts
        run: dotnet build --configuration Debug

      - name: Build the web UI into the Api
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # Playwright starts the Api (which applies migrations) and the Worker.
      - name: End-to-end test
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
