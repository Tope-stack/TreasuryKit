name: Images and demo deploy

# Builds the Api and Worker images on every push to main and pushes them to GitHub Container Registry
# as :latest and :<commit sha>. Deploying to the demo VM is a manual step (Actions → "Images and demo deploy"
# → Run workflow, with "deploy" ticked). See docs/deploy/vm.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the demo VM after building
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prefix: ${{ steps.names.outputs.prefix }}
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - id: names
        name: Image names (registry paths must be lower case)
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/treasurykit" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Host/TreasuryKit.${{ matrix.app == 'api' && 'Api' || 'Worker' }}/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.prefix }}-${{ matrix.app }}:latest
            ${{ steps.names.outputs.prefix }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # Pull the images built above (pinned to this commit) and restart; the Api migrates on start-up.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/treasurykit && sed -i 's/^TAG=.*/TAG=${GITHUB_SHA}/' .env && docker compose pull api worker && docker compose up -d && docker image prune -f"
