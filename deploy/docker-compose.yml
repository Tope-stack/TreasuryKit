# TreasuryKit demo deployment: one VM, Docker Compose (ADR 0010). See docs/deploy/vm.md.
#   cp .env.example .env   # fill in, then:
#   docker compose up -d
name: treasurykit

x-app: &app
  restart: unless-stopped
  volumes:
    - files:/data/files # uploads, shared by the Api and the Worker
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: treasurykit
      POSTGRES_USER: treasurykit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasurykit -d treasurykit"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the Api, Worker and backup containers can reach it.

  api:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/tope-stack/treasurykit}-api:${TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Demo # dev sign-in on, migrations on startup (appsettings.Demo.json)
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true" # trust Caddy's X-Forwarded-Proto/For
      ConnectionStrings__TreasuryKit: Host=postgres;Port=5432;Database=treasurykit;Username=treasurykit;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/tope-stack/treasurykit}-worker:${TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started } # the Api applies migrations; the Worker retries until they exist
    environment:
      DOTNET_ENVIRONMENT: Demo
      ConnectionStrings__TreasuryKit: Host=postgres;Port=5432;Database=treasurykit;Username=treasurykit;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates
      - caddy_config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: treasurykit
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: treasurykit
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  pgdata:
  files:
  backups:
  caddy_data:
  caddy_config:
